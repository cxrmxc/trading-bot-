name: Paper bot
on:
  schedule:
    - cron: "15 * * * *"   # Runs 15 minutes past every hour
  workflow_dispatch:       # Allows you to click "Run workflow" manually
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Crucial: allows the bot to save state.json back to the repo
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run the bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python paper_bot.py

      - name: Commit and save state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
