name: Run Paper Trading Bot

on:
  workflow_dispatch: # Allows you to run it manually
  schedule:
    - cron: '0 * * * *' # Runs every hour (modify as needed)

permissions:
  contents: write # CRITICAL: Allows the action to push changes back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # If you have a requirements.txt, uncomment the next line
          # pip install -r requirements.txt

      - name: Run the trading bot
        env:
          # Add your API keys here if needed, pulling from GitHub Secrets
          # API_KEY: ${{ secrets.API_KEY }}
        run: python paper_bot.py

      - name: Commit and push updated State.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add State.json
          # Only commit if there are actual changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update State.json [skip ci]" && git push)
